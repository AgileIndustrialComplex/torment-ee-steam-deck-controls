name: linux-installer

on:
  push:
    paths:
      - 'distribution/linux/**'
      - 'controller-lab/**'
      - '.github/workflows/linux-installer.yml'
  pull_request:
    paths:
      - 'distribution/linux/**'
      - 'controller-lab/**'
      - '.github/workflows/linux-installer.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SteamOS 3.5+ ships 3.11. The runner image no longer provides older
        # interpreters, so 3.10 is the lowest version actually exercised here.
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile
        working-directory: distribution/linux
        run: python -m py_compile install.py test_install.py

      - name: Shell syntax
        working-directory: distribution/linux
        run: |
          bash -n install-deck.sh
          bash -n uninstall-deck.sh

      - name: Build native bridge and run model tests
        working-directory: controller-lab
        run: python3 build_plugin_linux.py --check

      - name: Bridge symbol baseline
        # The game runs on SteamOS (glibc 2.35); keep the required baseline at
        # or below it so the shared object loads wherever the game does.
        working-directory: controller-lab/native
        run: |
          versions=$(objdump -T libpstcontroller.so | grep -oE 'GLIBC_[0-9.]+' | sort -u)
          echo "$versions"
          bad=$(echo "$versions" | awk -F. '$2 > 17 {print}' | head -1)
          if [ -n "$bad" ]; then
            echo "FAIL: $bad exceeds the GLIBC_2.17 baseline"
            exit 1
          fi
          exports=$(nm -D --defined-only libpstcontroller.so | grep -c ' T ')
          if [ "$exports" != "1" ]; then
            echo "FAIL: expected exactly one exported symbol, found $exports"
            exit 1
          fi

      - name: Fetch Windows payload
        # The Proton-path tests need the real Windows binaries; they are not
        # committed. Upstream's v0.1.31 release is the last one carrying
        # them, and its payload is version-independent for installer-test
        # purposes: the tests stamp their own manifest.
        run: |
          set -euo pipefail
          url="https://github.com/NiksonLichev/planescape-torment-enhanced-edition-xbox-controller-mod/releases/download/v0.1.31/PSTEE-Xbox-Controller-v0.1.31-preview.zip"
          curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/preview.zip"
          echo "PSTEE_PREVIEW_ZIP=$RUNNER_TEMP/preview.zip" >> "$GITHUB_ENV"

      - name: Assemble native payload
        working-directory: controller-lab
        run: python3 make_native_payload.py --out-dir "$RUNNER_TEMP/native-payload"

      - name: Installer tests
        working-directory: distribution/linux
        env:
          PSTEE_NATIVE_PAYLOAD_DIR: ${{ runner.temp }}/native-payload
        run: python test_install.py
